# Local infrastructure for the Mini Exchange Portfolio System.
# Task 1: Postgres + Kafka (KRaft, no Zookeeper) + topic init + inspection UIs.
# Application services are added later (Task 12).
#
#   docker compose up -d
#
# Host access:  Postgres -> localhost:${POSTGRES_HOST_PORT}
#               Kafka    -> localhost:${KAFKA_HOST_PORT}
#               Kafka UI -> http://localhost:${KAFKA_UI_PORT}
#               Adminer  -> http://localhost:${ADMINER_PORT}

services:
  postgres:
    image: postgres:16-alpine
    container_name: exchange-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: create the per-service databases (portfolio, audit), then exit.
  # Idempotent via `\gexec` (CREATE DATABASE has no IF NOT EXISTS).
  db-init:
    image: postgres:16-alpine
    container_name: exchange-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for db in portfolio audit; do
          echo "SELECT 'CREATE DATABASE $$db' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname='$$db')\gexec" \
            | psql -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} -v ON_ERROR_STOP=1
        done
        echo "Databases ready:"
        psql -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} -tAc \
          "SELECT datname FROM pg_database WHERE datname IN ('portfolio','audit') ORDER BY datname"
    restart: "no"

  kafka:
    image: apache/kafka:3.7.0
    container_name: exchange-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_HOST_PORT}:9094"
    environment:
      # --- KRaft (combined controller + broker, single node) ---
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # --- Listeners: INTERNAL for other containers, EXTERNAL for the host ---
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # --- Single-node friendly defaults ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12

  # One-shot: create the saga topics, then exit.
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: exchange-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        BS=kafka:9092
        for t in order-created price-quoted order-executed order-rejected; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BS --create --if-not-exists \
            --topic $$t --partitions 3 --replication-factor 1
        done
        echo "Topics ready:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BS --list
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: exchange-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: exchange
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"

  adminer:
    image: adminer:latest
    container_name: exchange-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  postgres-data:
  kafka-data:
