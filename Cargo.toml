[workspace]
resolver = "2"
members = [
    "shared",
    "market-service",
    "portfolio-service",
    "audit-service",
]

# Shared metadata inherited by member crates via `*.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Central dependency versions. Member crates opt in with
# `<dep>.workspace = true` so versions stay consistent across services.
# (sqlx / rdkafka are added in later tasks.)
[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["trace"] }
# Domain / event-schema building blocks (Task 4). sqlx feature flags for these
# (rust_decimal/uuid/chrono) get enabled when sqlx is added in Task 5.
rust_decimal = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
